<script>
// Answer marking for the baseline page. Plain functions, no DOM: tested by test.js, inlined by build.py.
// Statuses: 'right' | 'wrong' | 'check' (could not decide: a parent looks) | 'skip'.
// Maths answers have many valid spellings, so anything not recognised is 'check', never 'wrong', except numbers.
var SUPS = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};

function clean(s) {
  s = String(s == null ? '' : s).trim().toLowerCase();
  s = s.replace(/[−–—]/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi');
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { return '^' + Array.from(m).map(function (c) { return SUPS[c]; }).join(''); });
  return s;
}

// -> {v, pct} or null
function parseNum(raw) {
  var s = clean(raw).replace(/^[a-z]\s*=\s*/, '').replace(/^=\s*/, '');
  s = s.replace(/[£€$]/g, '').replace(/\s*(cm\^?[23]?|m\^?[23]?|km\/h|mph|km|mm|kg|degrees?|sides?|litres?|°|s|g)\s*$/, '').trim();
  var pct = false;
  if (/%$/.test(s)) { pct = true; s = s.slice(0, -1).trim(); }
  s = s.replace(/^\((.*)\)$/, '$1').trim();
  if (/^-?\d{1,3}(?:[ ,]\d{3})+(?:\.\d+)?$/.test(s)) s = s.replace(/[ ,]/g, '');
  var m;
  if ((m = s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))) {
    var d = +m[4]; if (!d) return null;
    return { v: (m[1] ? -1 : 1) * (+m[2] + (+m[3]) / d), pct: pct };
  }
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/))) {
    if (!+m[2]) return null;
    return { v: +m[1] / +m[2], pct: pct };
  }
  if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(s)) return { v: +s, pct: pct };
  return null;
}

// exp: number. opts.pct: the expected value is itself a percentage (so "37.5%" and "37.5" both mean 37.5).
function markNum(raw, exp, opts) {
  if (!String(raw == null ? '' : raw).trim()) return 'skip';
  var p = parseNum(raw); opts = opts || {};
  if (!p) return 'check';
  var v = p.v;
  if (p.pct && !opts.pct) v = v / 100;
  var tol = 1e-9 * Math.max(1, Math.abs(exp));
  if (Math.abs(v - exp) <= tol) return 'right';
  if (exp !== 0 && Math.abs(v - exp) / Math.abs(exp) <= 0.002) return 'check';   // looks like a rounded version
  return 'wrong';
}

// Polynomial-ish canonical form so 7y+2x == 2x+7y, x^2+2x-15 == -15+2x+x^2, 27b^3a^6 == 27a^6b^3. null if not that shape.
function canonPoly(raw) {
  var s = clean(raw).replace(/\s+/g, '').replace(/\*/g, '');
  if (!s || /[()\/]/.test(s)) return null;
  var terms = s.replace(/-/g, '+-').split('+').filter(Boolean), sum = {};
  for (var i = 0; i < terms.length; i++) {
    var m = terms[i].match(/^(-?)(\d*\.?\d*)((?:[a-z](?:\^-?\d+)?)*)$/);
    if (!m) return null;
    var c = (m[1] ? -1 : 1) * (m[2] === '' ? 1 : +m[2]);
    if (m[2] === '.' || isNaN(c)) return null;
    var vars = {}, re = /([a-z])(?:\^(-?\d+))?/g, mm;
    while ((mm = re.exec(m[3]))) vars[mm[1]] = (vars[mm[1]] || 0) + (mm[2] === undefined ? 1 : +mm[2]);
    var key = Object.keys(vars).sort().map(function (k) { return k + vars[k]; }).join('');
    sum[key] = (sum[key] || 0) + c;
  }
  return Object.keys(sum).filter(function (k) { return sum[k] !== 0; }).sort().map(function (k) { return sum[k] + '|' + k; }).join(';');
}

function strip(s) { return clean(s).replace(/\s+/g, '').replace(/^[a-z]=/, ''); }

function markAlg(raw, variants) {
  if (!String(raw == null ? '' : raw).trim()) return 'skip';
  var c = canonPoly(raw), t = strip(raw);
  for (var i = 0; i < variants.length; i++) {
    if (c !== null && canonPoly(variants[i]) === c) return 'right';
    if (strip(variants[i]) === t) return 'right';
  }
  return 'check';
}

// "2^3 x 3^2" style: bases sorted, exponents compared. Expects a full prime factorisation.
function primeMap(raw) {
  var s = clean(raw).replace(/\s+/g, '').replace(/([\d)])x(?=[\d(])/g, '$1*');
  if (!/^\d+(\^\d+)?(\*\d+(\^\d+)?)*$/.test(s)) return null;
  var map = {};
  s.split('*').forEach(function (f) { var a = f.split('^'); map[a[0]] = (map[a[0]] || 0) + (a[1] ? +a[1] : 1); });
  return Object.keys(map).map(Number).sort(function (a, b) { return a - b; }).map(function (k) { return k + '^' + map[k]; }).join('*');
}
function markPrime(raw, exp) {
  if (!String(raw == null ? '' : raw).trim()) return 'skip';
  var a = primeMap(raw);
  return a === null ? 'check' : (a === primeMap(exp) ? 'right' : 'wrong');
}

// Standard form: expected is a number. A numerically right answer that is not A x 10^n with 1<=A<10 is 'check'.
function parseSF(raw) {
  var s = clean(raw).replace(/\s+/g, '').replace(/([\d.])x(?=10)/g, '$1*');
  var m = s.match(/^(-?\d*\.?\d+)\*10\^\(?(-?\d+)\)?$/) || s.match(/^(-?\d*\.?\d+)e(-?\d+)$/);
  return m ? { m: +m[1], e: +m[2] } : null;
}
function markSF(raw, exp) {
  if (!String(raw == null ? '' : raw).trim()) return 'skip';
  var p = parseSF(raw), v;
  if (p) v = p.m * Math.pow(10, p.e);
  else { var q = parseNum(raw); if (!q || q.pct) return 'check'; v = q.v; }
  if (Math.abs(v - exp) > 1e-9 * Math.abs(exp)) return 'wrong';
  return p && Math.abs(p.m) >= 1 && Math.abs(p.m) < 10 ? 'right' : 'check';
}

function markPart(part, raw) {
  var blank = !String(raw == null ? '' : raw).trim();
  if (blank) return 'skip';
  switch (part.kind) {
    case 'num': {
      var r = markNum(raw, part.exp, { pct: part.pct }), f = part.simplest && clean(raw).replace(/\s+/g, '').match(/^(\d+)\/(\d+)$/);
      if (r === 'right' && f) { var x = +f[1], y = +f[2]; while (y) { var tmp = y; y = x % y; x = tmp; } if (x > 1) return 'check'; }   // right value, not in simplest form
      return r;
    }
    case 'alg': return markAlg(raw, part.variants);
    case 'prime': return markPrime(raw, part.exp);
    case 'sf': return markSF(raw, part.exp);
    case 'mc': return String(raw) === String(part.correct) ? 'right' : 'wrong';
    default: return 'check';          // free-text explanation
  }
}

if (typeof module !== 'undefined') module.exports = { clean: clean, parseNum: parseNum, markNum: markNum, canonPoly: canonPoly, markAlg: markAlg, markPrime: markPrime, markSF: markSF, markPart: markPart };

// Question bank for the baseline page: the same 37 questions as gcse-maths/scripts/build_diagnostic.py, split into parts for phone entry.
// Display markup: ^{..} superscript, {a//b} stacked fraction.  Parts: kind num|alg|prime|sf|mc|text.
// `exp` for num/sf is a number; `variants` for alg are accepted spellings (order of terms is handled by the marker).
var TOPICS = [
  { id: 'tables', core: true, strand: 'Number', label: 'Times tables' },
  { id: 'rounding', core: true, strand: 'Number', label: 'Rounding and estimating' },
  { id: 'negatives', strand: 'Number', label: 'Negative numbers' },
  { id: 'fractions', core: true, strand: 'Number', label: 'Fractions' },
  { id: 'percent', core: true, strand: 'Number', label: 'Percentages' },
  { id: 'ratio', core: true, strand: 'Number', label: 'Ratio and sharing' },
  { id: 'primes', strand: 'Number', label: 'Prime factors, HCF and LCM' },
  { id: 'fdp', strand: 'Number', label: 'Fractions, decimals and percentages' },
  { id: 'collect', strand: 'Algebra', label: 'Collecting like terms' },
  { id: 'expand1', core: true, strand: 'Algebra', label: 'Expanding brackets' },
  { id: 'expand2', core: true, strand: 'Algebra', label: 'Expanding two brackets' },
  { id: 'equations', core: true, strand: 'Algebra', label: 'Solving equations' },
  { id: 'subject', core: true, strand: 'Algebra', label: 'Changing the subject of a formula' },
  { id: 'factorise', strand: 'Algebra', label: 'Factorising' },
  { id: 'sequences', core: true, strand: 'Algebra', label: 'Sequences and nth term' },
  { id: 'algfrac', strand: 'Algebra', label: 'Algebraic fractions' },
  { id: 'indices', strand: 'Indices', label: 'Index laws' },
  { id: 'negfrac', strand: 'Indices', label: 'Negative and fractional indices' },
  { id: 'stdform', core: true, strand: 'Indices', label: 'Standard form' },
  { id: 'angles', strand: 'Shape and measures', label: 'Angles in polygons' },
  { id: 'circles', strand: 'Shape and measures', label: 'Circles: area and circumference' },
  { id: 'pythag', strand: 'Shape and measures', label: 'Pythagoras' },
  { id: 'units', strand: 'Shape and measures', label: 'Units, area conversions and speed' },
  { id: 'averages', strand: 'Data and money', label: 'Mean, median and range' },
  { id: 'prob', core: true, strand: 'Data and money', label: 'Probability' },
  { id: 'money', strand: 'Data and money', label: 'Money: interest, currency, best buys' }
];

var ROUNDS = [
  { id: 'a', title: 'Round A', sub: 'Number and fractions', mins: 15, qs: [
    { id: 'q01', topic: 'tables', calc: false, stem: 'Work these out in your head or on paper.', parts: [
      { id: 'a', label: '12 × 14', kind: 'num', exp: 168 }, { id: 'b', label: '15 × 16', kind: 'num', exp: 240 }] },
    { id: 'q02', topic: 'rounding', stem: 'Round 0.04752 to <b>2 significant figures</b>.', parts: [{ id: 'a', kind: 'num', exp: 0.048 }] },
    { id: 'q03', topic: 'rounding', stem: 'Estimate &nbsp;(6.8 × 31.2) ÷ 0.52 &nbsp;by rounding each number to 1 significant figure. Give the answer to your estimate.', parts: [{ id: 'a', kind: 'num', exp: 420 }] },
    { id: 'q04', topic: 'negatives', stem: 'Work out &nbsp;−7 − (−3) + 2 × (−4)', parts: [{ id: 'a', kind: 'num', exp: -12 }] },
    { id: 'q05', topic: 'fractions', stem: 'Work out &nbsp;{3//4} + {2//3}. &nbsp;Give your answer as a mixed number.', parts: [{ id: 'a', kind: 'num', exp: 17 / 12, hint: 'write a mixed number like 1 1/2, or 3/2' }] },
    { id: 'q06', topic: 'fractions', stem: 'Work out &nbsp;2{1//2} ÷ {3//4}', parts: [{ id: 'a', kind: 'num', exp: 10 / 3, hint: 'e.g. 1 1/2 or 3/2' }] },
    { id: 'q07', topic: 'percent', stem: 'Increase £240 by 15%.', parts: [{ id: 'a', kind: 'num', exp: 276 }] },
    { id: 'q08', topic: 'percent', hard: true, stem: 'A coat costs £60 in a sale, after 20% was taken off. What was the <b>original</b> price?', parts: [{ id: 'a', kind: 'num', exp: 75 }] },
    { id: 'q09', topic: 'ratio', stem: 'Share £84 in the ratio 3 : 4.', parts: [
      { id: 'a', label: 'the smaller share (£)', kind: 'num', exp: 36 }, { id: 'b', label: 'the larger share (£)', kind: 'num', exp: 48 }] },
    { id: 'q10', topic: 'primes', stem: 'a) Write 72 as a product of prime factors, using powers. &nbsp; b) Find the HCF of 12 and 18. &nbsp; c) Find the LCM of 12 and 18.', parts: [
      { id: 'a', label: 'a) 72 =', kind: 'prime', exp: '2^3*3^2', hint: 'type powers like 2^3 x 3^2' },
      { id: 'b', label: 'b) HCF', kind: 'num', exp: 6 }, { id: 'c', label: 'c) LCM', kind: 'num', exp: 36 }] },
    { id: 'q11', topic: 'fdp', stem: 'a) Write 0.35 as a fraction in its simplest form. &nbsp; b) Write {3//8} as a percentage.', parts: [
      { id: 'a', label: 'a)', kind: 'num', exp: 7 / 20, simplest: true, hint: 'a fraction like 3/5' }, { id: 'b', label: 'b) %', kind: 'num', exp: 37.5, pct: true }] }
  ] },
  { id: 'b', title: 'Round B', sub: 'Algebra', mins: 15, qs: [
    { id: 'q12', topic: 'collect', stem: 'Simplify &nbsp;3a + 5b − a + 2b', parts: [{ id: 'a', kind: 'alg', variants: ['2a+7b'] }] },
    { id: 'q13', topic: 'expand1', stem: 'Expand and simplify &nbsp;3(2x − 1) − 2(x − 4)', parts: [{ id: 'a', kind: 'alg', variants: ['4x+5'] }] },

  function viewRoundEnd(r) {
    var A = myA(), good = [], n = 0, skipped = 0;
    r.qs.forEach(function (q) { q.parts.forEach(function (p) { var rec = A[q.id + p.id]; if (!rec) return; n++; if (rec.st === 'skip') skipped++;
      if (rec.st === 'right' && rec.sure >= 2) { var t = topicOf(q.topic).label; if (good.indexOf(t) < 0) good.push(t); } }); });
    var h = '<h2>All done. Thank you.</h2><div class="card"><p>' + (n - skipped) + ' answers in, ' + skipped + ' left blank. Both are useful.</p>' +
      (good.length ? '<p><b>Looking good:</b> ' + good.map(esc).join(', ') + '.</p>' : '') + '<p class="muted small">Nothing is marked for you here. Your parent will go through it with you, and you will get the real picture together.</p></div>' + savingBanner() + '<p class="small muted" id="sendStatus">' + (S.auto && S.sendFailed ? 'Could not send automatically. Tap Send my results and paste the code to your parent.' : S.sent.finish ? 'Sent to your parent ✓' : '') + '</p>' +
      '<div class="row"><a class="btn primary" href="#home">Back to start</a>' + (needSend() ? '<button class="btn quiet" id="sendCode">Send my results</button>' : '') + '</div><div id="codeBox"></div>';
    app.innerHTML = h; wireCommon();
    if (S.auto && !S.endSent) { S.endSent = true; autoSend('finish'); }
  }

  /* ---------- parent view ---------- */
  function fmtExp(p) {
    if (p.kind === 'mc') return p.options[p.correct];
    if (p.kind === 'alg') return p.variants[0];
    if (p.kind === 'prime') return p.exp.replace(/\^(\d+)/g, '^{$1}').replace(/\*/g, ' × ');
    if (p.kind === 'sf') { var e = Math.floor(Math.log10(Math.abs(p.exp)) + 1e-12), m = Math.round(p.exp / Math.pow(10, e) * 1e6) / 1e6; return m + ' × 10^{' + e + '}'; }
    if (p.kind === 'num') {
      var v = p.exp; if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
      for (var d = 2; d <= 64; d++) { var n = v * d; if (Math.abs(n - Math.round(n)) < 1e-9) return Math.round(n) + '/' + d + (d > 1 && v > 1 ? ' (' + Math.floor(v) + ' ' + Math.round((v - Math.floor(v)) * d) + '/' + d + ')' : ''); }
      return String(Math.round(v * 1e4) / 1e4);
    }
    return '(explanation)';
  }
  function shownRaw(p, rec) { if (!rec || rec.skipped || rec.raw === '' || rec.raw == null) return '<span class="muted">blank</span>'; if (p.kind === 'mc') return esc(p.options[+rec.raw] || rec.raw); return esc(rec.raw); }

  function viewParent() {
    if (!(S.isOwner || S.canEdit)) { app.innerHTML = '<a class="muted" href="#home">← Back</a><div class="card"><p>The parent view is only for the person who set this page up.</p></div>'; return; }
    var A = S.dbAnswers, C = S.dbConf, P = S.dbProfile, qs = allQs(), parts = [], last = '';
    qs.forEach(function (x) { x.q.parts.forEach(function (p) { parts.push({ r: x.r, q: x.q, p: p, id: x.q.id + p.id, rec: A[x.q.id + p.id] }); }); });
    var answered = 0, rightN = 0, marked = 0, wrongN = 0, checkN = 0, skipN = 0;
    parts.forEach(function (x) { if (!x.rec) return; var st = effStatus(x.id, x.rec); if (x.rec.at > last) last = x.rec.at;
      if (st === 'skip') skipN++; else { answered++; if (st === 'right') { rightN++; marked++; } else if (st === 'wrong') { wrongN++; marked++; } else checkN++; } });
    var h = '<div class="row spread"><a class="muted" href="#home">← Page Masal sees</a><span class="muted small">Live: updates as she answers</span></div><h1>Masal: where things stand</h1>';
    if (S.preview) h += '<div class="banner">You are the owner, so what you enter on the question pages is not saved. Everything below is what Masal has saved.</div>';
    h += '<div class="tiles">' +
      '<div class="tile"><b>' + answered + ' / ' + parts.length + '</b><span>answers given</span></div>' +
      '<div class="tile"><b>' + (marked ? Math.round(rightN / marked * 100) + '%' : '–') + '</b><span>right, of those the page could mark (' + marked + ')</span></div>' +
      '<div class="tile"><b>' + checkN + '</b><span>need your eye</span></div>' +
      '<div class="tile"><b>' + skipN + '</b><span>skipped / don\'t know</span></div>' +
      '<div class="tile"><b>' + TOPICS.filter(function (t) { return t.core && C[t.id]; }).length + ' / ' + TOPICS.filter(function (t) { return t.core; }).length + '</b><span>topics rated</span></div>' +
      '<div class="tile"><b style="font-size:1.2rem">' + (last ? when(last) : 'Not started') + '</b><span>last active</span></div></div>';
    if (P.hardest || P.feeling) h += '<div class="card"><h3>In her words</h3>' + (P.feeling ? '<p>Maths feels: <b>' + ['', 'Awful', 'Hard', 'OK', 'Fine', 'Good'][P.feeling] + '</b> (' + P.feeling + '/5)</p>' : '') + (P.hardest ? '<p>“' + esc(P.hardest) + '”</p>' : '') + '</div>';

    // confidence vs result
    var rows = TOPICS.filter(function (t) { return t.core; }).map(function (t) {
      var ps = parts.filter(function (x) { return x.q.topic === t.id && x.rec; }), c = { right: 0, wrong: 0, check: 0, skip: 0 };
      ps.forEach(function (x) { c[effStatus(x.id, x.rec)]++; });
      var lvl = C[t.id] && C[t.id].level, tot = ps.length, note = '', cls = 'note';
      if (lvl === 'got' && c.wrong) { note = 'Says confident, got some wrong'; }
      else if ((lvl === 'lost' || lvl === 'wobbly') && tot && !c.wrong && !c.skip && !c.check && c.right === tot) { note = 'Better than she thinks'; cls = 'good'; }
      else if (tot && c.skip * 2 >= tot) { note = 'Mostly skipped'; }
      return { t: t, lvl: lvl, c: c, tot: tot, note: note, cls: cls };
    });
    rows = rows.filter(function (x) { return x.tot || x.lvl; }).concat(rows.filter(function (x) { return !x.tot && !x.lvl; }));   // topics with something to show first
    h += '<div class="card"><h3>What she says vs what she did</h3><div class="scroll"><table><tr><th>Topic</th><th>She says</th><th>Result</th><th></th></tr>' + rows.map(function (x) {
      var lab = x.lvl ? CONF.filter(function (c) { return c[0] === x.lvl; })[0][1] : '<span class="muted">not rated</span>';
      var res = x.tot ? (x.c.right + ' right' + (x.c.wrong ? ', ' + x.c.wrong + ' wrong' : '') + (x.c.check ? ', ' + x.c.check + ' to check' : '') + (x.c.skip ? ', ' + x.c.skip + ' skipped' : '')) : '<span class="muted">not done yet</span>';
      return '<tr><td>' + esc(x.t.label) + '</td><td>' + lab + '</td><td>' + res + '</td><td>' + (x.note ? '<span class="pill ' + x.cls + '">' + x.note + '</span>' : '') + '</td></tr>'; }).join('') + '</table></div></div>';

    // sure but wrong; guessed but right
    var sw = parts.filter(function (x) { return x.rec && x.rec.sure === 3 && effStatus(x.id, x.rec) === 'wrong'; });
    var gr = parts.filter(function (x) { return x.rec && x.rec.sure === 1 && effStatus(x.id, x.rec) === 'right'; });
    h += '<div class="card"><h3>Worth talking about</h3><p><b>Pretty sure but wrong</b> (a belief to untangle, usually the most useful finding): ' + (sw.length ? sw.map(function (x) { return esc(topicOf(x.q.topic).label) + ' (' + x.q.id + x.p.id + ')'; }).join('; ') : '<span class="muted">none yet</span>') + '</p>' +
      '<p><b>Guessing but right</b> (knows more than she thinks): ' + (gr.length ? gr.map(function (x) { return esc(topicOf(x.q.topic).label) + ' (' + x.q.id + x.p.id + ')'; }).join('; ') : '<span class="muted">none yet</span>') + '</p></div>';

    // detail by round
    [QUICK].forEach(function (r) {
      var ps = parts.filter(function (x) { return x.r === r; });
      h += '<details open><summary>Every answer (' + ps.filter(function (x) { return x.rec; }).length + '/' + ps.length + ')</summary><div class="card scroll"><table><tr><th>Q</th><th>Her answer</th><th>Expected</th><th>Mark</th><th>Sure?</th><th>Your call</th></tr>' + ps.map(function (x) {
        if (!x.rec) return '<tr><td>' + x.id + '</td><td colspan="5" class="muted">not done</td></tr>';
        var st = effStatus(x.id, x.rec), rv = S.dbReviews[x.id] && S.dbReviews[x.id].st, sureL = { 0: 'don\'t know', 1: 'guessing', 2: 'not sure', 3: 'pretty sure' }[x.rec.sure] || '';
        return '<tr><td>' + x.id + (x.q.hard ? ' ★' : '') + '<br><span class="muted small">' + esc(topicOf(x.q.topic).label) + '</span></td><td>' + shownRaw(x.p, x.rec) + '</td><td>' + M(esc(fmtExp(x.p))) + '</td><td><span class="pill ' + st + '">' + st + '</span>' + (rv ? '<br><span class="small muted">you set this</span>' : '') + '</td><td>' + sureL + '</td>' +
          '<td class="ov" data-id="' + x.id + '"><button data-o="right" aria-pressed="' + (rv === 'right') + '">Right</button><button data-o="wrong" aria-pressed="' + (rv === 'wrong') + '">Wrong</button><button data-o="" aria-label="Clear">×</button></td></tr>'; }).join('') + '</table><p class="small muted">The page marks numbers strictly and anything algebraic leniently: "to check" means it could not tell. Her working on paper matters more than the final line.</p></div></details>';
    });

    h += '<details><summary>Import results sent as a code</summary><div class="card"><p class="small muted">If Masal could not save from her phone, she can send a code instead. Paste it here.</p><textarea id="imp" class="code"></textarea><div class="row"><button class="btn" id="doImp">Import</button><span class="small" id="impMsg">' + esc(S.importMsg) + '</span></div></div></details>';
    app.innerHTML = h;
    $$('.ov button').forEach(function (b) { b.onclick = function () {
      var id = b.parentNode.getAttribute('data-id'), o = b.getAttribute('data-o');
      if (!S.db) return;
      chain = chain.then(function () { var d = S.db.collection('reviews').doc(id); return o ? d.set({ st: o, at: new Date().toISOString() }) : d.delete(); }).catch(function () {});
    }; });
    $('#doImp').onclick = function () {
      try {
        var j = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!j || !j.a) throw 0;
        var n = 0; if (!S.db) { S.importMsg = 'Saving is not connected here.'; return viewParent(); }
        Object.keys(j.a).forEach(function (k) { n++; (function (k) { chain = chain.then(function () { return S.db.collection('answers').doc(k).set(Object.assign({}, j.a[k], { imported: true })); }).catch(function () {}); })(k); });
        Object.keys(j.c || {}).forEach(function (k) { chain = chain.then(function () { return S.db.collection('confidence').doc(k).set(j.c[k]); }).catch(function () {}); });
        if (j.p && Object.keys(j.p).length) chain = chain.then(function () { return S.db.collection('profile').doc('main').set(j.p); }).catch(function () {});
        S.importMsg = 'Importing ' + n + ' answers…';
      } catch (e) { S.importMsg = 'That did not look like a results code.'; }
      viewParent();
    };
  }

  /* ---------- start up ---------- */
  function subscribe(coll, key) {
    S.db.collection(coll).onSnapshot(function (snap) {
      var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); });
      if (coll === 'profile') S[key] = o.main || {}; else S[key] = o;
      softRender();
    }, function () { /* a dead listener: the page keeps working from local state */ });
  }
  function start() {
    loadLocal(); render();
    var cl = window.claude;
    if (!cl || !cl.use) { S.auto = /^https?:/.test(location.protocol); S.ready = true; render(); return; }
    cl.use('user').then(function (u) {
      if (!u) return;
      return Promise.all([u.isOwner(), u.canEdit(), u.can('data.write')]).then(function (v) { S.isOwner = !!v[0]; S.canEdit = !!v[1]; S.canWrite = v[2]; S.preview = S.isOwner || S.canEdit; });
    }).catch(function () {}).then(function () { return cl.use('db'); }).then(function (db) {
      S.ready = true;
      if (db) { S.db = db; subscribe('answers', 'dbAnswers'); subscribe('confidence', 'dbConf'); subscribe('profile', 'dbProfile'); subscribe('reviews', 'dbReviews'); }
      render();
    }).catch(function () { S.ready = true; render(); });
  }
  start();
})();
</script>
</body></html>
